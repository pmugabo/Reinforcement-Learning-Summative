[project]
name = "mugabo-patricia-rl-summative"
version = "0.1.0"
description = "AquaForecast mission-based reinforcement learning for sustainable water allocation in Kimironko, Rwanda"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "gymnasium>=1.2.0,<2.0.0",
    "matplotlib>=3.10.0,<4.0.0",
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.2.0,<4.0.0",
    "pillow>=11.0.0,<13.0.0",
    "pyglet>=2.1.0,<3.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "stable-baselines3>=2.7.0,<3.0.0",
    "tensorboard>=2.18.0,<3.0.0",
    "torch>=2.7.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv]
package = false
